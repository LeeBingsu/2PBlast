<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048 Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        * {
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .tile {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.15s ease-in-out;
        }

        .tile-new {
            animation: appear 0.2s ease-in-out;
        }

        .tile-merged {
            animation: pop 0.2s ease-in-out;
        }

        @keyframes appear {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .game-over-overlay, .win-overlay {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; }
        .tile-256 { background: #edcc61; color: #f9f6f2; }
        .tile-512 { background: #edc850; color: #f9f6f2; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; }
        .tile-super { background: #3c3a32; color: #f9f6f2; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Header -->
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-5xl font-bold text-gray-700">2048</h1>
            <div class="flex gap-2">
                <div class="bg-gray-700 rounded-lg px-4 py-2 text-center min-w-20">
                    <div class="text-gray-300 text-xs uppercase">Score</div>
                    <div id="score" class="text-white text-xl font-bold">0</div>
                </div>
                <div class="bg-gray-700 rounded-lg px-4 py-2 text-center min-w-20">
                    <div class="text-gray-300 text-xs uppercase">Best</div>
                    <div id="best-score" class="text-white text-xl font-bold">0</div>
                </div>
            </div>
        </div>

        <!-- Instructions & Buttons -->
        <div class="flex items-center justify-between mb-4">
            <p class="text-gray-600 text-sm">Join tiles to get <strong>2048!</strong></p>
            <div class="flex gap-2">
                <button id="undo-btn" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-bold transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    ↶ Undo
                </button>
                <button id="new-game-btn" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg font-bold transition-colors">
                    New Game
                </button>
            </div>
        </div>

        <!-- Game Board -->
        <div id="game-container" class="relative bg-gray-600 rounded-xl p-3">
            <div id="grid-background" class="grid grid-cols-4 gap-3">
                <div class="bg-gray-500 rounded-lg aspect-square"></div>
                <div class="bg-gray-500 rounded-lg aspect-square"></div>
                <div class="bg-gray-500 rounded-lg aspect-square"></div>
                <div class="bg-gray-500 rounded-lg aspect-square"></div>
                <div class="bg-gray-500 rounded-lg aspect-square"></div>
                <div class="bg-gray-500 rounded-lg aspect-square"></div>
                <div class="bg-gray-500 rounded-lg aspect-square"></div>
                <div class="bg-gray-500 rounded-lg aspect-square"></div>
                <div class="bg-gray-500 rounded-lg aspect-square"></div>
                <div class="bg-gray-500 rounded-lg aspect-square"></div>
                <div class="bg-gray-500 rounded-lg aspect-square"></div>
                <div class="bg-gray-500 rounded-lg aspect-square"></div>
                <div class="bg-gray-500 rounded-lg aspect-square"></div>
                <div class="bg-gray-500 rounded-lg aspect-square"></div>
                <div class="bg-gray-500 rounded-lg aspect-square"></div>
                <div class="bg-gray-500 rounded-lg aspect-square"></div>
            </div>
            <div id="tile-container" class="absolute inset-3"></div>
            
            <!-- Game Over Overlay -->
            <div id="game-over" class="hidden game-over-overlay absolute inset-0 bg-white/80 rounded-xl flex flex-col items-center justify-center">
                <h2 class="text-4xl font-bold text-gray-700 mb-4">Game Over!</h2>
                <button id="try-again-btn" class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-lg font-bold transition-colors">
                    Try Again
                </button>
            </div>

            <!-- Win Overlay -->
            <div id="win-overlay" class="hidden win-overlay absolute inset-0 bg-yellow-400/80 rounded-xl flex flex-col items-center justify-center">
                <h2 class="text-4xl font-bold text-white mb-2">You Win! 🎉</h2>
                <p class="text-white mb-4">You reached 2048!</p>
                <div class="flex gap-2">
                    <button id="keep-playing-btn" class="bg-white hover:bg-gray-100 text-gray-700 px-6 py-3 rounded-lg font-bold transition-colors">
                        Keep Playing
                    </button>
                    <button id="new-game-win-btn" class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-lg font-bold transition-colors">
                        New Game
                    </button>
                </div>
            </div>
        </div>

        <!-- Score Addition Animation -->
        <div id="score-add" class="fixed text-orange-500 font-bold text-xl pointer-events-none opacity-0 transition-all duration-300"></div>
    </div>

    <script>
        class Game2048 {
            constructor() {
                this.gridSize = 4;
                this.grid = [];
                this.score = 0;
                this.bestScore = parseInt(localStorage.getItem('best2048')) || 0;
                this.history = [];
                this.gameOver = false;
                this.won = false;
                this.keepPlaying = false;
                this.tileContainer = document.getElementById('tile-container');
                this.tileElements = new Map();
                this.tileIdCounter = 0;

                this.init();
                this.setupEventListeners();
            }

            init() {
                this.grid = Array(this.gridSize).fill(null).map(() => Array(this.gridSize).fill(null));
                this.score = 0;
                this.gameOver = false;
                this.won = false;
                this.keepPlaying = false;
                this.history = [];
                this.tileContainer.innerHTML = '';
                this.tileElements.clear();

                this.addRandomTile();
                this.addRandomTile();
                this.updateDisplay();
            }

            setupEventListeners() {
                // Keyboard
                document.addEventListener('keydown', (e) => {
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                        e.preventDefault();
                        const direction = e.key.replace('Arrow', '').toLowerCase();
                        this.move(direction);
                    }
                });

                // Touch/Swipe
                let startX, startY;
                const container = document.getElementById('game-container');

                container.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                });

                container.addEventListener('touchend', (e) => {
                    if (!startX || !startY) return;
                    
                    const endX = e.changedTouches[0].clientX;
                    const endY = e.changedTouches[0].clientY;
                    const diffX = endX - startX;
                    const diffY = endY - startY;
                    const threshold = 50;

                    if (Math.abs(diffX) > Math.abs(diffY)) {
                        if (Math.abs(diffX) > threshold) {
                            this.move(diffX > 0 ? 'right' : 'left');
                        }
                    } else {
                        if (Math.abs(diffY) > threshold) {
                            this.move(diffY > 0 ? 'down' : 'up');
                        }
                    }

                    startX = startY = null;
                });

                // Buttons
                document.getElementById('new-game-btn').addEventListener('click', () => this.init());
                document.getElementById('try-again-btn').addEventListener('click', () => {
                    document.getElementById('game-over').classList.add('hidden');
                    this.init();
                });
                document.getElementById('undo-btn').addEventListener('click', () => this.undo());
                document.getElementById('keep-playing-btn').addEventListener('click', () => {
                    this.keepPlaying = true;
                    document.getElementById('win-overlay').classList.add('hidden');
                });
                document.getElementById('new-game-win-btn').addEventListener('click', () => {
                    document.getElementById('win-overlay').classList.add('hidden');
                    this.init();
                });
            }

            saveState() {
                const state = {
                    grid: this.grid.map(row => row.map(cell => cell ? { value: cell.value } : null)),
                    score: this.score
                };
                this.history.push(JSON.stringify(state));
                if (this.history.length > 10) this.history.shift();
            }

            undo() {
                if (this.history.length === 0) return;
                
                const state = JSON.parse(this.history.pop());
                this.score = state.score;
                this.gameOver = false;
                document.getElementById('game-over').classList.add('hidden');
                
                // Clear current tiles
                this.tileContainer.innerHTML = '';
                this.tileElements.clear();
                
                // Restore grid
                this.grid = state.grid.map((row, r) => 
                    row.map((cell, c) => {
                        if (cell) {
                            const tile = { value: cell.value, id: this.tileIdCounter++ };
                            this.createTileElement(tile, r, c, false);
                            return tile;
                        }
                        return null;
                    })
                );
                
                this.updateDisplay();
            }

            getEmptyCells() {
                const empty = [];
                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        if (!this.grid[r][c]) empty.push({ r, c });
                    }
                }
                return empty;
            }

            addRandomTile() {
                const empty = this.getEmptyCells();
                if (empty.length === 0) return;

                const { r, c } = empty[Math.floor(Math.random() * empty.length)];
                const value = Math.random() < 0.9 ? 2 : 4;
                const tile = { value, id: this.tileIdCounter++ };
                this.grid[r][c] = tile;
                this.createTileElement(tile, r, c, true);
            }

            createTileElement(tile, row, col, isNew = false) {
                const el = document.createElement('div');
                el.className = `tile ${this.getTileClass(tile.value)} ${isNew ? 'tile-new' : ''}`;
                el.textContent = tile.value;
                el.style.fontSize = this.getFontSize(tile.value);
                this.positionTile(el, row, col);
                this.tileContainer.appendChild(el);
                this.tileElements.set(tile.id, el);
            }

            getTileClass(value) {
                if (value <= 2048) return `tile-${value}`;
                return 'tile-super';
            }

            getFontSize(value) {
                if (value < 100) return '2rem';
                if (value < 1000) return '1.75rem';
                if (value < 10000) return '1.25rem';
                return '1rem';
            }

            positionTile(el, row, col) {
                const gap = 12;
                const containerWidth = this.tileContainer.offsetWidth;
                const tileSize = (containerWidth - gap * 3) / 4;
                
                el.style.width = `${tileSize}px`;
                el.style.height = `${tileSize}px`;
                el.style.left = `${col * (tileSize + gap)}px`;
                el.style.top = `${row * (tileSize + gap)}px`;
            }

            move(direction) {
                if (this.gameOver) return;

                this.saveState();
                
                let moved = false;
                let scoreGained = 0;
                const mergedTiles = [];

                const vectors = {
                    up: { r: -1, c: 0 },
                    down: { r: 1, c: 0 },
                    left: { r: 0, c: -1 },
                    right: { r: 0, c: 1 }
                };

                const vector = vectors[direction];
                const traversals = this.buildTraversals(vector);

                // Clear merged flags
                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        if (this.grid[r][c]) this.grid[r][c].merged = false;
                    }
                }

                traversals.r.forEach(r => {
                    traversals.c.forEach(c => {
                        const tile = this.grid[r][c];
                        if (!tile) return;

                        const { farthest, next } = this.findFarthestPosition(r, c, vector);
                        const nextTile = next ? this.grid[next.r][next.c] : null;

                        if (nextTile && nextTile.value === tile.value && !nextTile.merged) {
                            // Merge
                            const newValue = tile.value * 2;
                            nextTile.value = newValue;
                            nextTile.merged = true;
                            scoreGained += newValue;
                            mergedTiles.push(nextTile);

                            // Remove old tile
                            this.grid[r][c] = null;
                            const oldEl = this.tileElements.get(tile.id);
                            if (oldEl) {
                                this.positionTile(oldEl, next.r, next.c);
                                setTimeout(() => oldEl.remove(), 150);
                            }
                            this.tileElements.delete(tile.id);

                            // Update merged tile element
                            const mergedEl = this.tileElements.get(nextTile.id);
                            if (mergedEl) {
                                mergedEl.textContent = newValue;
                                mergedEl.className = `tile ${this.getTileClass(newValue)} tile-merged`;
                                mergedEl.style.fontSize = this.getFontSize(newValue);
                            }

                            moved = true;

                            // Check win
                            if (newValue === 2048 && !this.won && !this.keepPlaying) {
                                this.won = true;
                                setTimeout(() => {
                                    document.getElementById('win-overlay').classList.remove('hidden');
                                }, 300);
                            }
                        } else if (farthest.r !== r || farthest.c !== c) {
                            // Move tile
                            this.grid[farthest.r][farthest.c] = tile;
                            this.grid[r][c] = null;
                            
                            const el = this.tileElements.get(tile.id);
                            if (el) this.positionTile(el, farthest.r, farthest.c);
                            
                            moved = true;
                        }
                    });
                });

                if (moved) {
                    this.score += scoreGained;
                    if (this.score > this.bestScore) {
                        this.bestScore = this.score;
                        localStorage.setItem('best2048', this.bestScore);
                    }
                    
                    if (scoreGained > 0) {
                        this.showScoreAnimation(scoreGained);
                    }

                    setTimeout(() => {
                        this.addRandomTile();
                        this.updateDisplay();
                        
                        if (!this.canMove()) {
                            this.gameOver = true;
                            setTimeout(() => {
                                document.getElementById('game-over').classList.remove('hidden');
                            }, 300);
                        }
                    }, 150);
                } else {
                    // Remove saved state if no move happened
                    this.history.pop();
                }

                this.updateDisplay();
            }

            buildTraversals(vector) {
                const traversals = { r: [], c: [] };
                
                for (let i = 0; i < this.gridSize; i++) {
                    traversals.r.push(i);
                    traversals.c.push(i);
                }

                if (vector.r === 1) traversals.r.reverse();
                if (vector.c === 1) traversals.c.reverse();

                return traversals;
            }

            findFarthestPosition(r, c, vector) {
                let prev;
                
                do {
                    prev = { r, c };
                    r += vector.r;
                    c += vector.c;
                } while (this.isWithinBounds(r, c) && !this.grid[r][c]);

                return {
                    farthest: prev,
                    next: this.isWithinBounds(r, c) ? { r, c } : null
                };
            }

            isWithinBounds(r, c) {
                return r >= 0 && r < this.gridSize && c >= 0 && c < this.gridSize;
            }

            canMove() {
                // Check for empty cells
                if (this.getEmptyCells().length > 0) return true;

                // Check for possible merges
                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        const tile = this.grid[r][c];
                        if (!tile) continue;

                        // Check right
                        if (c < this.gridSize - 1 && this.grid[r][c + 1]?.value === tile.value) return true;
                        // Check down
                        if (r < this.gridSize - 1 && this.grid[r + 1][c]?.value === tile.value) return true;
                    }
                }

                return false;
            }

            showScoreAnimation(points) {
                const scoreEl = document.getElementById('score');
                const addEl = document.getElementById('score-add');
                const rect = scoreEl.getBoundingClientRect();
                
                addEl.textContent = `+${points}`;
                addEl.style.left = `${rect.left + rect.width / 2}px`;
                addEl.style.top = `${rect.top}px`;
                addEl.style.opacity = '1';
                addEl.style.transform = 'translateY(0)';
                
                setTimeout(() => {
                    addEl.style.opacity = '0';
                    addEl.style.transform = 'translateY(-30px)';
                }, 100);
            }

            updateDisplay() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('best-score').textContent = this.bestScore;
                document.getElementById('undo-btn').disabled = this.history.length === 0;
            }
        }

        // Start the game when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new Game2048();
        });
    </script>
</body>
</html>
